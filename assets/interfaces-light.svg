<text class="mono" x="44" y="115" font-size="13.5" fill="#1f2328" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;0.667" calcMode="discrete" dur="15s" repeatCount="indefinite"/>Done — responsive, themeable, fully keyboard-accessible.</text><text class="mono" x="44" y="115" font-size="13.5" fill="#1f2328" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333;0.667" calcMode="discrete" dur="15s" repeatCount="indefinite"/>Shipped with zero layout shift and 60fps transitions.</text><text class="mono" x="44" y="115" font-size="13.5" fill="#1f2328" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.667" calcMode="discrete" dur="15s" repeatCount="indefinite"/>Dark mode, reduced motion, screen readers: covered.</text><rect x="792" y="96" width="0" height="28" fill="#ffffff"><animate attributeName="x" values="40;792;792;40;792;792;40;792;792;40" keyTimes="0;0.16;0.333;0.333;0.493;0.666;0.667;0.827;0.999;1" dur="15s" repeatCount="indefinite"/><animate attributeName="width" values="752;0;0;752;0;0;752;0;0;752" keyTimes="0;0.16;0.333;0.333;0.493;0.666;0.667;0.827;0.999;1" dur="15s" repeatCount="indefinite"/></rect>
